<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>上海初一英语每日练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111827;color:#e5e7eb;font-family:'Microsoft YaHei','Segoe UI',sans-serif;display:flex;justify-content:center;min-height:100vh}
#root{width:100%;max-width:500px;padding:16px}
h1{text-align:center;color:#fbbf24;font-size:20px;letter-spacing:4px;margin-bottom:4px}
.sub{text-align:center;color:#6b7280;font-size:12px;margin-bottom:16px}
.row{display:flex;gap:8px;margin-bottom:12px}
.card{flex:1;background:#1f2937;border:1px solid #374151;border-radius:10px;padding:12px;text-align:center}
.card .v{font-size:24px;font-weight:700;color:#fbbf24}
.card .v.red{color:#ef4444}
.card .v.grn{color:#22c55e}
.card .lb{font-size:11px;color:#9ca3af;margin-top:2px}
.pbar{height:8px;background:#1f2937;border-radius:4px;overflow:hidden;margin-bottom:4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:4px;transition:width .3s}
.plabel{font-size:11px;color:#6b7280;text-align:right;margin-bottom:14px}
.dots{display:flex;justify-content:center;gap:5px;margin-bottom:14px}
.dots span{width:22px;height:22px;border-radius:50%;background:#1f2937;border:1px solid #374151;display:flex;align-items:center;justify-content:center;font-size:9px;color:#6b7280}
.dots span.ok{background:#14532d;border-color:#22c55e;color:#22c55e}
.dots span.today{border-color:#fbbf24}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;text-align:center}
.btn:active{transform:scale(.96)}
.btn-main{background:#fbbf24;color:#111;width:100%}
.btn-main:hover{background:#f59e0b}
.btn-main:disabled{background:#374151;color:#6b7280;cursor:not-allowed}
.btn-ghost{background:#1f2937;color:#d1d5db;border:1px solid #374151;width:100%;margin-top:8px}
.btn-ghost:hover{background:#374151}
.wb{display:flex;align-items:center;gap:12px;padding:14px;background:#1f2937;border:1px solid #ef4444;border-radius:10px;cursor:pointer;margin:12px 0;transition:all .15s}
.wb:hover{background:#2d1b1b}
.wb:active{transform:scale(.98)}
.wb .ico{font-size:26px}
.wb .info{flex:1}
.wb .title{font-size:14px;font-weight:700;color:#ef4444}
.wb .desc{font-size:12px;color:#9ca3af;margin-top:2px}
.wb .desc b{color:#ef4444}
.wb .arr{font-size:20px;color:#ef4444}
.wb.hide{display:none}
.qhead{display:flex;justify-content:space-between;font-size:12px;color:#9ca3af;margin-bottom:6px}
.qhead b{color:#fbbf24}
.pmini{height:5px;background:#1f2937;border-radius:3px;overflow:hidden;margin-bottom:10px}
.pmini i{display:block;height:100%;background:#fbbf24;border-radius:3px;transition:width .3s}
.tag{display:inline-block;font-size:11px;color:#9ca3af;background:#1f2937;padding:2px 10px;border-radius:8px;margin-bottom:10px}
.qcenter{text-align:center;padding:10px 0}
.qcenter .big{font-size:32px;font-weight:700;color:#fff;letter-spacing:1px}
.qcenter .small{font-size:13px;color:#9ca3af;margin-top:4px}
.speak{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:12px;background:#1f2937;border:1px solid #374151;color:#9ca3af;font-size:12px;cursor:pointer;font-family:inherit}
.speak:hover{background:#374151;color:#fbbf24}
.ipa{display:inline-block;margin-top:4px;font-size:14px;color:#a78bfa;font-family:Consolas,'Lucida Sans Unicode',sans-serif;letter-spacing:.5px}
.lets{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:10px 0}
.lets div{width:36px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;font-family:Consolas,monospace;background:#1f2937;border:2px solid #374151;border-radius:6px;color:#e5e7eb}
.lets .bl{border:2px dashed #fbbf24;color:#fbbf24}
.lets .ok{border-color:#22c55e;color:#22c55e}
.lets .no{border-color:#ef4444;color:#ef4444}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{padding:12px;background:#1f2937;border:1px solid #374151;border-radius:8px;font-size:15px;color:#e5e7eb;cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.opts button:hover{background:#374151}
.opts button.ok{background:#14532d;border-color:#22c55e;color:#22c55e}
.opts button.no{background:#451a1a;border-color:#ef4444;color:#ef4444}
.opts button.off{pointer-events:none;opacity:.6}
.kb{margin-top:10px}
.kb div{display:flex;justify-content:center;gap:3px;margin-bottom:3px}
.kb button{width:30px;height:36px;border-radius:5px;border:1px solid #374151;background:#1f2937;color:#d1d5db;font-size:13px;font-weight:600;font-family:Consolas,monospace;cursor:pointer}
.kb button:hover{background:#374151}
.kb button:active{transform:scale(.88)}
.kb button.used{opacity:.15;pointer-events:none}
.fb{min-height:24px;text-align:center;font-size:13px;font-weight:600;margin:8px 0}
.fb.ok{color:#22c55e}
.fb.no{color:#ef4444}
.tipbox{background:#1e1b4b;border:1px solid #fbbf24;border-radius:10px;padding:12px;margin-top:10px;text-align:center}
.tipbox .tt{font-size:12px;color:#fbbf24;font-weight:700;margin-bottom:4px}
.tipbox .td{font-size:13px;color:#e5e7eb;line-height:1.6}
.rcard{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:24px;text-align:center}
.rcard h2{font-size:20px;color:#fbbf24;margin-bottom:4px}
.rcard .big{font-size:44px;font-weight:800;color:#fff;margin:8px 0}
.rcard .big span{color:#6b7280;font-size:22px}
.rcard .det{font-size:12px;color:#9ca3af;margin-bottom:14px}
.wlist{text-align:left;margin:10px 0;padding:8px;background:#111827;border-radius:6px;font-size:12px;max-height:150px;overflow-y:auto}
.wlist div{padding:3px 0;border-bottom:1px solid #1f2937}
.wlist b{color:#fbbf24}.wlist em{color:#9ca3af;font-style:normal}
.rcard button{padding:10px 24px;border:1px solid #374151;border-radius:8px;background:transparent;color:#fbbf24;font-size:13px;cursor:pointer;font-family:inherit;margin:4px}
.rcard button:hover{background:#fbbf24;color:#111}
.revlist{max-height:55vh;overflow-y:auto}
.revlist div{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #1f2937;font-size:13px}
.revlist .en{color:#e5e7eb;font-weight:600}.revlist .cn{color:#9ca3af}.revlist .x{color:#ef4444;font-size:11px}
.empty{text-align:center;color:#6b7280;padding:30px;font-size:13px}
.revbtns{display:flex;gap:8px;margin-top:14px;justify-content:center}
.revbtns button{padding:8px 18px;border:1px solid #374151;border-radius:7px;background:transparent;color:#d1d5db;font-size:12px;cursor:pointer;font-family:inherit}
.revbtns button:hover{background:#374151}
.revbtns .back{color:#fbbf24;border-color:#fbbf24}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.calgrid div{height:30px;border-radius:5px;background:#111827;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b7280}
.calgrid div.h{background:none;color:#9ca3af;font-size:10px;font-weight:600}
.calgrid div.done{background:#14532d;color:#22c55e;font-weight:600}
.calgrid div.now{border:1px solid #fbbf24}
.calgrid div.click{cursor:pointer;transition:all .15s}
.calgrid div.click:hover{background:#374151;transform:scale(1.15);z-index:2;position:relative;box-shadow:0 0 8px rgba(251,191,36,.3)}
.calcell{position:relative}
.caltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid #fbbf24;border-radius:8px;padding:8px 12px;white-space:nowrap;z-index:10;font-size:11px;color:#e5e7eb;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.5);line-height:1.6}
.caltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fbbf24}
.calcell:hover .caltip{display:block}
.calmonth{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 4px}
.calmonth button{background:#1f2937;border:1px solid #374151;color:#fbbf24;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all .15s}
.calmonth button:hover{background:#374151}
.calmonth .mlabel{font-size:15px;font-weight:600;color:#fbbf24;min-width:100px;text-align:center}
.calgrid div.part{background:#4a3800;color:#fbbf24}
.calgrid div.today-cell{border:2px solid #fbbf24}
</style>
</head>

    window.speechSynthesis.speak(u);

}

  } catch(e) {}
}

// ======= 数据存储 =======
var store = null;

function today() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadStore() {
  if (store) return store;
  try {
    var raw = localStorage.getItem('vocab_sh7');
    if (raw) { store = JSON.parse(raw); return store; }
  } catch(e) {}
  store = { days: {}, wrong: {}, checked: [] };
  return store;
}

function saveStore() {
  try { localStorage.setItem('vocab_sh7', JSON.stringify(store)); } catch(e) {}
}

function getToday() {
  var s = loadStore();
  var t = today();
  if (!s.days[t]) s.days[t] = { done: [], rounds: 0, wrongToday: 0 };
  return s.days[t];
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function totalLearned() {
  var s = loadStore();
  var set = {};
  for (var k in s.days) {
    var arr = s.days[k].done || [];
    for (var i = 0; i < arr.length; i++) set[arr[i]] = 1;
  }
  return Object.keys(set).length;
}

var quiz = null;
var roundDone = false;
var calMonth = new Date().getMonth();
var calYear = new Date().getFullYear();

function render() {
  var r = document.getElementById('root');
  if (page === 'home') drawHome(r);
  else if (page === 'quiz') drawQuiz(r);
  else if (page === 'result') drawResult(r);
  else if (page === 'review') drawReview(r);
  else if (page === 'calendar') drawCalendar(r);
}

    var dd = s.days[ds];

      '<div class="card"><div class="v">' + rounds + '/' + MAX_ROUNDS + '</div><div class="lb">完成轮次</div></div>' +
      '<div class="card"><div class="v">' + remain + '</div><div class="lb">今日剩余</div></div>' +
      '<div class="card"><div class="v red">' + wc + '</div><div class="lb">累计错题</div></div>' +
    '</div>' +
    '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="plabel">总进度 ' + learned + '/' + WLEN + ' (' + pct + '%)</div>' +
    '<div class="dots">' + dotsHtml + '</div>' + wrongHtml +
    '<button class="btn btn-main" ' + (canGo ? 'onclick="startQuiz()"' : 'disabled') + '>' +
      (canGo ? '开始练习 (' + PER_ROUND + '题)' : '今日已完成 ✓') + '</button>' +
    '<button class="btn btn-ghost" onclick="page=\'calendar\';render()">📅 打卡日历</button>';
}

function startQuiz() {
  var s = loadStore(); var t = today(); var day = s.days[t];
  var doneSet = {};
  for (var i = 0; i < day.done.length; i++) doneSet[day.done[i]] = 1;
  var pool = [];
  for (var i = 0; i < WLEN; i++) { if (!doneSet[i]) pool.push(i); }
  if (pool.length === 0) { page = 'home'; render(); return; }
  var picked = shuffle(pool).slice(0, PER_ROUND);
  var types = ['cn2en', 'en2cn', 'fill'];
  var qs = [];
  for (var i = 0; i < picked.length; i++) qs.push(makeQuestion(picked[i], types[i % 3]));
  qs = shuffle(qs);
  quiz = { qs: qs, qi: 0, score: 0, wrongs: [], answered: false, tried: {} };
  roundDone = false; page = 'quiz'; render();
  var fq = quiz.qs[0];
  setTimeout(function() { if (fq.type === 'cn2en') sayCn(fq.cn); else say(fq.en); }, 200);
}

function makeQuestion(wi, type) {
  var w = WORDS[wi]; var orig = w[0]; var en = orig.toLowerCase(); var cn = w[1];
  if (type === 'fill') {
    var cands = [];
    for (var i = 0; i < en.length; i++) { if (/[a-z]/.test(en[i])) cands.push(i); }
    var pos;
    if (en.length >= 5) {
      var mid = Math.floor(en.length / 2);
      var near = cands.filter(function(x) { return Math.abs(x - mid) <= 2; });
      pos = near.length > 0 ? near[Math.floor(Math.random() * near.length)] : cands[Math.floor(Math.random() * cands.length)];
    } else { pos = cands[Math.floor(Math.random() * cands.length)]; }
    return { type: 'fill', wi: wi, en: en, orig: orig, cn: cn, bpos: pos, ans: en[pos] };
  }
  var distractors = getDistractors(wi, 3);
  if (type === 'en2cn') {
    var opts = shuffle([{ t: cn, c: true }].concat(distractors.map(function(d) { return { t: WORDS[d][1], c: false }; })));
    return { type: 'en2cn', wi: wi, en: en, orig: orig, cn: cn, opts: opts, ans: cn };
  }
  var opts = shuffle([{ t: en, c: true }].concat(distractors.map(function(d) { return { t: WORDS[d][0], c: false }; })));
  return { type: 'cn2en', wi: wi, en: en, orig: orig, cn: cn, opts: opts, ans: en };
}

function getDistractors(wi, n) {
  var target = WORDS[wi][0]; var result = []; var used = {}; used[wi] = 1;
  for (var g = 0; g < CONFUSE.length; g++) {
    var group = CONFUSE[g]; var inGroup = false;
    for (var j = 0; j < group.length; j++) { if (group[j] === target) { inGroup = true; break; } }
    if (inGroup) {
      var indices = [];
      for (var j = 0; j < group.length; j++) {
        if (group[j] === target) continue;
        for (var k = 0; k < WLEN; k++) {
          if (!used[k] && WORDS[k][0] === group[j]) { indices.push(k); used[k] = 1; break; }
        }
      }
      var picked = shuffle(indices);
      for (var j = 0; j < picked.length && result.length < n; j++) result.push(picked[j]);
      if (result.length >= n) return shuffle(result).slice(0, n);
      break;
    }
  }
  var cands = [];
  for (var i = 0; i < WLEN; i++) {
    if (used[i]) continue;
    var diff = Math.abs(WORDS[i][0].length - target.length);
    if (diff <= 3) cands.push({ i: i, d: diff });
  }
  cands.sort(function(a, b) { return a.d - b.d; });
  for (var i = 0; i < cands.length && result.length < n; i++) result.push(cands[i].i);
  return shuffle(result).slice(0, n);
}

function drawQuiz(r) {
  if (!quiz) { page = 'home'; render(); return; }
  if (quiz.qi >= quiz.qs.length) { roundDone = true; page = 'result'; render(); return; }
  var q = quiz.qs[quiz.qi];
  var pct = Math.round(quiz.qi / quiz.qs.length * 100);
  var tname = { fill: '字母填空', en2cn: '英 → 中', cn2en: '中 → 英' }[q.type];
  var body = '';
  if (q.type === 'fill') {
    var boxes = '';
    for (var i = 0; i < q.en.length; i++) {
      var cls = i === q.bpos ? 'bl' : '';
      boxes += '<div id="lb' + i + '" class="' + cls + '">' + (i === q.bpos ? '?' : q.orig[i]) + '</div>';
    }
    var rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm']; var kb = '';
    for (var ri = 0; ri < rows.length; ri++) {
      kb += '<div>';
      for (var ci = 0; ci < rows[ri].length; ci++) {
        var ch = rows[ri][ci];
        kb += '<button class="' + (quiz.tried[ch]?'used':'') + '" onclick="fillKey(\'' + ch + '\')">' + ch + '</button>';
      }
      kb += '</div>';
    }
    var phonStr = PHON[q.en] ? '<div class="ipa">' + PHON[q.en] + '</div>' : '';
    body = '<div class="qcenter"><div class="small">' + q.cn + '</div></div>' +
      '<div style="text-align:center"><button class="speak" onclick="say(\'' + q.en + '\')">🔊 听发音</button>' + phonStr + '</div>' +
      '<div class="lets" id="lets">' + boxes + '</div><div class="fb" id="fb">&nbsp;</div>' +
      '<div class="kb">' + kb + '</div><div id="tipzone"></div>';
  } else if (q.type === 'cn2en') {
    var opts = '';
    for (var i = 0; i < q.opts.length; i++) opts += '<button id="op' + i + '" onclick="pickOpt(' + i + ')">' + q.opts[i].t + '</button>';
    body = '<div class="qcenter"><div class="big">' + q.cn + '</div><div class="small">选出正确的英文单词</div>' +
      '<div style="margin-top:8px"><button class="speak" onclick="sayCn(\'' + q.cn + '\')">🔊 听中文</button> ' +
      '<button class="speak" onclick="say(\'' + q.en + '\')">🔊 听英文</button></div></div>' +
      '<div class="opts" id="opts">' + opts + '</div><div class="fb" id="fb">&nbsp;</div><div id="tipzone"></div>';
  } else {
    var phonStr = PHON[q.en] ? '<div class="ipa">' + PHON[q.en] + '</div>' : '';
    var opts = '';
    for (var i = 0; i < q.opts.length; i++) opts += '<button id="op' + i + '" onclick="pickOpt(' + i + ')">' + q.opts[i].t + '</button>';
    body = '<div class="qcenter"><div class="big">' + q.orig + '</div><div class="small">选出正确的中文意思</div>' +
      '<div style="text-align:center"><button class="speak" onclick="say(\'' + q.en + '\')">🔊 听发音</button>' + phonStr + '</div></div>' +
      '<div class="opts" id="opts">' + opts + '</div><div class="fb" id="fb">&nbsp;</div><div id="tipzone"></div>';
  }
  r.innerHTML = '<div class="qhead"><span>第 <b>' + (quiz.qi+1) + '</b>/' + quiz.qs.length + ' 题</span><span>正确 <b>' + quiz.score + '</b></span></div>' +
    '<div class="pmini"><i style="width:' + pct + '%"></i></div><div class="tag">' + tname + '</div>' + body;
}

function fillKey(ch) {
  if (!quiz || quiz.answered) return;
  var q = quiz.qs[quiz.qi]; quiz.answered = true; quiz.tried[ch] = 1;
  var btns = document.querySelectorAll('.kb button');
  for (var i = 0; i < btns.length; i++) { if (btns[i].textContent === ch) btns[i].classList.add('used'); }
  var box = document.getElementById('lb' + q.bpos); var fb = document.getElementById('fb');
  if (ch === q.ans) {
    if (box) { box.textContent = q.orig[q.bpos]; box.className = 'ok'; }
    fb.className = 'fb ok'; fb.textContent = '✓ 正确！'; quiz.score++; recCorrect(q.wi); say(q.en);
  } else {
    if (box) { box.textContent = q.orig[q.bpos]; box.className = 'no'; }
    fb.className = 'fb no'; fb.textContent = '✗ 正确答案：' + q.orig[q.bpos] + ' → ' + q.orig;
    quiz.wrongs.push({ en: q.en, cn: q.cn, wi: q.wi }); recWrong(q.wi);
  }
  showTip(q.wi, q.en, q.cn); setTimeout(nextQ, 1000);
}

function pickOpt(idx) {
  if (!quiz || quiz.answered) return;
  quiz.answered = true; var q = quiz.qs[quiz.qi]; var fb = document.getElementById('fb');
  var btns = document.querySelectorAll('#opts button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.add('off');
    if (q.opts[i].c) btns[i].classList.add('ok');
    if (i === idx && !q.opts[i].c) btns[i].classList.add('no');
  }
  if (q.opts[idx].c) {
    fb.className = 'fb ok'; fb.textContent = '✓ 正确！'; quiz.score++; recCorrect(q.wi); say(q.en);
  } else {
    fb.className = 'fb no'; fb.textContent = '✗ 正确答案：' + q.ans;
    quiz.wrongs.push({ en: q.en, cn: q.cn, wi: q.wi }); recWrong(q.wi);
  }
  showTip(q.wi, q.en, q.cn); setTimeout(nextQ, 1000);
}

function nextQ() {
  quiz.qi++; quiz.answered = false; quiz.tried = {}; render();
  if (page === 'quiz' && quiz.qs[quiz.qi]) {
    var nq = quiz.qs[quiz.qi];
    setTimeout(function() { if (nq.type === 'cn2en') sayCn(nq.cn); else say(nq.en); }, 150);
  }
}

document.addEventListener('keydown', function(e) {
  if (page !== 'quiz' || !quiz) return;
  var q = quiz.qs[quiz.qi];
  if (!q || q.type !== 'fill' || quiz.answered) return;
  var ch = e.key.toLowerCase();
  if (/^[a-z]$/.test(ch)) fillKey(ch);
});

function showTip(wi, en, cn) {
  var s = loadStore(); var wc = (s.wrong || {})[wi] || 0;
  if (wc < 3) return;
  var zone = document.getElementById('tipzone'); if (!zone) return;
  var tip = TIPS[en] || ('多读几遍：' + en + ' = ' + cn + '，大声念出来帮助记忆！');
  zone.innerHTML = '<div class="tipbox"><div class="tt">💡 记忆口诀（已错' + wc + '次）</div>' +
    '<div class="td">' + tip + '</div>' +
    '<div style="margin-top:8px"><button class="speak" onclick="say(\'' + en + '\')">🔊 再听一遍</button></div></div>';
  say(en);
}

function recCorrect(wi) { var s = loadStore(); var t = today(); if (s.days[t].done.indexOf(wi) === -1) s.days[t].done.push(wi); saveStore(); }
function recWrong(wi) {
  var s = loadStore(); var t = today();
  if (s.days[t].done.indexOf(wi) === -1) s.days[t].done.push(wi);
  s.days[t].wrongToday = (s.days[t].wrongToday || 0) + 1;
  if (!s.wrong) s.wrong = {}; s.wrong[wi] = (s.wrong[wi] || 0) + 1; saveStore();
}
function sealRound() {
  if (!roundDone) return; var s = loadStore(); var t = today();
  s.days[t].rounds = (s.days[t].rounds || 0) + 1;
  if (!s.checked) s.checked = [];
  if (s.checked.indexOf(t) === -1 && s.days[t].done.length >= DAILY) s.checked.push(t);
  saveStore(); roundDone = false;
}

function drawResult(r) {
  if (!quiz) { page = 'home'; render(); return; }
  var tot = quiz.qs.length; var pct = tot > 0 ? Math.round(quiz.score / tot * 100) : 0;
  var msg = pct >= 90 ? '太棒了！' : pct >= 70 ? '不错！' : pct >= 50 ? '加油！' : '多复习错题吧';
  var wl = '';
  if (quiz.wrongs.length > 0) {
    wl = '<div class="wlist"><div style="color:#ef4444;font-weight:600;margin-bottom:4px">本轮错题：</div>';
    for (var i = 0; i < quiz.wrongs.length; i++) { var w = quiz.wrongs[i]; wl += '<div><b>' + w.en + '</b> <em>— ' + w.cn + '</em></div>'; }
    wl += '</div>';
  }
  r.innerHTML = '<h1>本轮成绩</h1><div class="rcard"><h2>' + msg + '</h2>' +
    '<div class="big">' + quiz.score + '<span> / ' + tot + '</span></div>' +
    '<div class="det">正确率 ' + pct + '% · 错 ' + quiz.wrongs.length + ' 题</div>' + wl +
    '<button onclick="goHome()">返回首页</button>' +
    (quiz.wrongs.length > 0 ? '<button onclick="page=\'review\';render()">查看错题本</button>' : '') + '</div>';
}

function goHome() { sealRound(); page = 'home'; render(); }

function drawReview(r) {
  var s = loadStore(); var wr = s.wrong || {}; var keys = Object.keys(wr).map(Number);
  var list = '';
  if (keys.length === 0) { list = '<div class="empty">没有错题，继续保持！</div>'; }
  else {
    keys.sort(function(a, b) { return wr[b] - wr[a]; });
    list = '<div class="revlist">';
    for (var i = 0; i < keys.length; i++) { var wi = keys[i]; var w = WORDS[wi];
      list += '<div><span class="en">' + w[0] + '</span><span class="cn">' + w[1] + '</span><span class="x">错' + wr[wi] + '次</span></div>'; }
    list += '</div>';
  }
  r.innerHTML = '<h1>📕 错题本</h1><div class="sub">共 ' + keys.length + ' 个错词</div>' + list +
    '<div class="revbtns"><button class="back" onclick="goHome()">返回</button>' +
    (keys.length > 0 ? '<button onclick="practiceWrong()">练习错题</button>' : '') +
    (keys.length > 0 ? '<button onclick="clearWrong()">清空</button>' : '') + '</div>';
}

function clearWrong() { if (!confirm('确定清空所有错题？')) return; var s = loadStore(); s.wrong = {}; saveStore(); render(); }

function practiceWrong() {
  var s = loadStore(); var keys = Object.keys(s.wrong || {}).map(Number);
  if (keys.length === 0) return;
  var picked = shuffle(keys).slice(0, Math.min(PER_ROUND, keys.length));
  var types = ['cn2en', 'en2cn', 'fill']; var qs = [];
  for (var i = 0; i < picked.length; i++) qs.push(makeQuestion(picked[i], types[i % 3]));
  quiz = { qs: shuffle(qs), qi: 0, score: 0, wrongs: [], answered: false, tried: {} };
  roundDone = false; page = 'quiz'; render();
}

function drawCalendar(r) {
  var s = loadStore(); var y = calYear; var m = calMonth;
  var firstDay = new Date(y, m, 1).getDay(); var daysInMonth = new Date(y, m + 1, 0).getDate(); var todayStr = today();
  var navHtml = '<div class="calmonth"><button onclick="changeMonth(-1)">‹</button>' +
    '<span class="mlabel">' + y + '年' + (m + 1) + '月</span><button onclick="changeMonth(1)">›</button></div>';
  var grid = ''; var headers = ['日','一','二','三','四','五','六'];
  for (var i = 0; i < 7; i++) grid += '<div class="h">' + headers[i] + '</div>';
  for (var i = 0; i < firstDay; i++) grid += '<div></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var dd = s.days[ds]; var doneN = dd && dd.done ? dd.done.length : 0;
    var ok = doneN >= DAILY; var isChecked = s.checked && s.checked.indexOf(ds) !== -1; var isNow = (ds === todayStr);
    var wrongN = 0;
    if (dd && dd.done) { for (var wi = 0; wi < dd.done.length; wi++) { if (s.wrong && s.wrong[dd.done[wi]]) wrongN++; } }
    var correctN = doneN - wrongN;
    var cls = ''; if (ok) cls += 'done '; else if (doneN > 0) cls += 'part '; if (isNow) cls += 'today-cell '; if (doneN > 0) cls += 'click ';
    var cellContent = '';
    if (doneN > 0) {
      cellContent = '<div class="caltip">已学 ' + doneN + '/' + DAILY + ' 词<br>' +
        '<span style="color:#22c55e">✓ 正确 ' + correctN + '</span><br>' +
        '<span style="color:#ef4444">✗ 错误 ' + wrongN + '</span>' +
        (isChecked ? '<br><span style="color:#fbbf24">已打卡 ✓</span>' : '<br><span style="color:#9ca3af">点击可打卡</span>') + '</div>';
    }
    var displayNum = isChecked ? '✓' : d;
    grid += '<div class="calcell"><div class="' + cls.trim() + '" onclick="pickDate(\'' + ds + '\',' + doneN + ',' + isChecked + ')">' + displayNum + '</div>' + cellContent + '</div>';
  }
  var totalChecked = (s.checked || []).length;
  r.innerHTML = '<h1>📅 打卡日历</h1>' + navHtml +
    '<div class="sub">累计打卡 ' + totalChecked + ' 天 · 悬浮查看详情 · 点击打卡</div>' +
    '<div class="calgrid">' + grid + '</div>' +
    '<div class="revbtns"><button class="back" onclick="goHome()">返回</button></div>';
}

function pickDate(ds, doneN, isChecked) {
  if (doneN <= 0) return;
  if (isChecked) { alert(ds + ' 已打卡！'); return; }
  if (doneN < DAILY) { alert(ds + ' 学了 ' + doneN + ' 个词，还不够 ' + DAILY + ' 个，不能打卡哦'); return; }
  if (!confirm(ds + '：已学 ' + doneN + ' 词，确认打卡？')) return;
  var s = loadStore(); if (!s.checked) s.checked = [];
  if (s.checked.indexOf(ds) === -1) s.checked.push(ds); saveStore(); render();
}

function changeMonth(dir) {
  calMonth += dir; if (calMonth < 0) { calMonth = 11; calYear--; } if (calMonth > 11) { calMonth = 0; calYear++; } render();
}

render();
</script>
</body>
